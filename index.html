    const getLocalDateString = (dateObj = new Date()) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getInitialAttendance = () => {
      const today = new Date();
      const d1 = new Date(today); d1.setDate(today.getDate() - 1);
      const d2 = new Date(today); d2.setDate(today.getDate() - 2);
      const d4 = new Date(today); d4.setDate(today.getDate() - 4);
      
      return {
        [getLocalDateString(d1)]: { hours: '3.5', note: '미적분Ⅰ 소단원 1-1, 1-2 완벽 정복!', timestamp: d1.getTime() },
        [getLocalDateString(d2)]: { hours: '2.5', note: '역학과 에너지 등가속도 오답 정리', timestamp: d2.getTime() },
        [getLocalDateString(d4)]: { hours: '4.0', note: '아침 공부 출석 성공 🔥', timestamp: d4.getTime() }
      };
    };

    const getDefaultTargetDate = () => {
      const target = new Date();
      target.setDate(target.getDate() + 28);
      return getLocalDateString(target);
    };

    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('g2_study_theme');
        return saved ? saved === 'dark' : true;
      });

      const [activeTab, setActiveTab] = useState('home');

      const [examInfo, setExamInfo] = useState(() => {
        const saved = localStorage.getItem('g2_study_exam');
        return saved ? JSON.parse(saved) : {
          title: '고2 지필평가 (기말고사)',
          targetDate: getDefaultTargetDate()
        };
      });
      const [isEditingExam, setIsEditingExam] = useState(false);

      const [selectedQuoteCat, setSelectedQuoteCat] = useState('전체');
      const [quoteIdx, setQuoteIdx] = useState(0);

      const [attendance, setAttendance] = useState(() => {
        const saved = localStorage.getItem('g2_study_attendance');
        return saved ? JSON.parse(saved) : getInitialAttendance();
      });

      const todayKey = getLocalDateString();
      const [studyHours, setStudyHours] = useState(() => attendance[todayKey]?.hours || '2.0');
      const [studyNote, setStudyNote] = useState(() => attendance[todayKey]?.note || '');

      const [subjects, setSubjects] = useState(() => {
        const saved = localStorage.getItem('g2_study_subjects_v2');
        if (saved) return JSON.parse(saved);
        return DEFAULT_SUBJECTS;
      });

      const [newSubjectName, setNewSubjectName] = useState('');
      const [newSubUnitInputs, setNewSubUnitInputs] = useState({});
      const [copiedType, setCopiedType] = useState(null);
      const [showLockPreview, setShowLockPreview] = useState(false);

      useEffect(() => {
        localStorage.setItem('g2_study_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('g2_study_exam', JSON.stringify(examInfo));
      }, [examInfo]);

      useEffect(() => {
        localStorage.setItem('g2_study_attendance', JSON.stringify(attendance));
      }, [attendance]);

      useEffect(() => {
        localStorage.setItem('g2_study_subjects_v2', JSON.stringify(subjects));
      }, [subjects]);

      const filteredQuotes = useMemo(() => {
        if (selectedQuoteCat === '전체') return QUOTES;
        return QUOTES.filter(q => q.category === selectedQuoteCat);
      }, [selectedQuoteCat]);

      const currentQuote = useMemo(() => {
        const safeIdx = quoteIdx % filteredQuotes.length;
        return filteredQuotes[safeIdx] || QUOTES[0];
      }, [filteredQuotes, quoteIdx]);

      const dDayInfo = useMemo(() => {
        const today = new Date(todayKey + 'T00:00:00');
        const target = new Date(examInfo.targetDate + 'T00:00:00');
        const diffTime = target - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays > 0) return { label: `D-${diffDays}`, days: diffDays, status: 'upcoming' };
        if (diffDays === 0) return { label: 'D-Day', days: 0, status: 'today' };
        return { label: `D+${Math.abs(diffDays)}`, days: diffDays, status: 'passed' };
      }, [examInfo.targetDate, todayKey]);

      const streakCount = useMemo(() => {
        let count = 0;
        const checkDate = new Date();
        
        if (!attendance[getLocalDateString(checkDate)]) {
          checkDate.setDate(checkDate.getDate() - 1);
        }

        while (true) {
          const key = getLocalDateString(checkDate);
          if (attendance[key]) {

Script.setWidget(w);
Script.complete();`;

                              <div className="flex items-center gap-1.5 mb-0.5">
                                <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400">
                                  {sub.name}
                                </span>
                                <span className="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">
                                  소단원 {nextUnit.code}
                                </span>
                              </div>
                              <p className="text-xs font-medium break-words">
                                {nextUnit.title}
                              </p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* 탭 2: 과목별 소단원 시험범위 관리 */}
              {activeTab === 'scope' && (
                <div className="space-y-4">
                  <div className={`p-4 rounded-3xl border space-y-3 ${
                    darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'
                  }`}>
                    <form onSubmit={handleAddSubject} className="flex gap-2">
                      <input
                        type="text"
                        value={newSubjectName}
                        onChange={(e) => setNewSubjectName(e.target.value)}
                        placeholder="새 과목명 입력 (예: 영어Ⅱ, 경제, 독서와 작문)"
                        className={`flex-1 px-3.5 py-2.5 rounded-2xl text-xs border focus:outline-none focus:ring-2 focus:ring-indigo-500 ${
                          darkMode 
                            ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' 
                            : 'bg-slate-50 border-slate-200 text-slate-900'
                        }`}
                      />
                      <button
                        type="submit"
                        className="px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-1 shrink-0 shadow-md shadow-indigo-600/20"
                      >
                        <Plus className="w-4 h-4" /> 과목 추가
                      </button>
                    </form>

                    <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
                      <span className="text-[10px] opacity-60 shrink-0">빠른 과목 추가:</span>
                      {RECOMMENDED_SUBJECTS.map((name) => (
                        <button
                          key={name}
                          type="button"
                          onClick={() => addSubjectByName(name)}
                          className={`px-2.5 py-1 rounded-xl text-[11px] font-medium border whitespace-nowrap transition ${
                            darkMode
                              ? 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
                              : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                          }`}
                        >
                          + {name}
                        </button>
                      ))}
                    </div>
                  </div>

                  {subjects.map((sub) => {
                    const units = sub.subUnits || [];
                    const total = units.length;
                    const doneCount = units.filter(u => u.done).length;
                    const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
                    const inputState = newSubUnitInputs[sub.id] || { code: '', title: '' };

                    return (
                      <div
                        key={sub.id}
                        className={`p-5 rounded-3xl border space-y-3 ${
                          darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="font-extrabold text-base">{sub.name}</span>
                            <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-500/15 text-indigo-400">
                              소단원 {doneCount}/{total} ({pct}%)
                            </span>
                          </div>
                          <button
                            onClick={() => handleDeleteSubject(sub.id)}
                            className="p-1.5 text-slate-500 hover:text-rose-400 transition"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>

                        <div className={`w-full h-1.5 rounded-full overflow-hidden ${darkMode ? 'bg-slate-800' : 'bg-slate-100'}`}>
                          <div
                            className="h-full bg-indigo-500 transition-all duration-300"
                            style={{ width: `${pct}%` }}
                          />
                        </div>

                        <div className="space-y-2 pt-1">
                          {units.length === 0 && (
                            <p className="text-xs opacity-50 py-2 text-center">
                              아래 입력창에서 시험에 들어가는 소단원을 한 단원씩 추가해 보세요!
                            </p>
                          )}
                          {units.map((unit) => (
                            <div
                              key={unit.id}
                              className={`group flex items-center justify-between gap-2 p-2.5 rounded-xl border transition ${
                                unit.done
                                  ? darkMode
                                    ? 'bg-slate-950/60 border-slate-800/60 opacity-60'
                                    : 'bg-slate-50 border-slate-200/60 opacity-60'
                                  : darkMode
                                  ? 'bg-slate-800/40 border-slate-800'
                                  : 'bg-white border-slate-200'
                              }`}
                            >
                              <div
                                onClick={() => handleToggleSubUnit(sub.id, unit.id)}
                                className="flex items-center gap-2.5 flex-1 cursor-pointer"
                              >
                                {unit.done ? (
                                  <CheckCircle2 className="w-5 h-5 text-emerald-500 shrink-0" />
                                ) : (
                                  <Circle className="w-5 h-5 text-indigo-400 shrink-0" />
                                )}
                                <div className="flex flex-wrap items-center gap-1.5">
                                  <span className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded ${
                                    unit.done 
                                      ? 'bg-slate-700/40 text-slate-400' 
                                      : 'bg-indigo-500/20 text-indigo-300'
                                  }`}>
                                    {unit.code}
                                  </span>
                                  <span className={`text-xs font-medium ${unit.done ? 'line-through' : ''}`}>
                                    {unit.title}
                                  </span>
                                </div>
                              </div>
                              <button
                                onClick={() => handleDeleteSubUnit(sub.id, unit.id)}
                                className="opacity-40 hover:opacity-100 hover:text-rose-400 p-1"
                              >
                                <X className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          ))}
                        </div>

                        <div className="pt-2 border-t border-slate-800/40">
                          <div className="text-[11px] font-semibold opacity-70 mb-1.5 flex items-center gap-1">
                            <Bookmark className="w-3 h-3 text-indigo-400" />
                            <span>{sub.name} 소단원 1개씩 추가하기</span>
                          </div>
                          <div className="flex gap-1.5">
                            <input
                              type="text"
                              value={inputState.code || ''}
                              onChange={(e) =>
                                setNewSubUnitInputs({
                                  ...newSubUnitInputs,
                                  [sub.id]: { ...inputState, code: e.target.value }
                                })
                              }
                              placeholder="단원번호 (예: 2-3)"
                              className={`w-28 px-2.5 py-2 rounded-xl text-xs font-mono border focus:outline-none focus:ring-1 focus:ring-indigo-500 ${
                                darkMode 
                                  ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' 
                                  : 'bg-slate-50 border-slate-200 text-slate-900'
                              }`}
                            />
                            <input
                              type="text"
                              value={inputState.title || ''}
                              onChange={(e) =>
                                setNewSubUnitInputs({
                                  ...newSubUnitInputs,
                                  [sub.id]: { ...inputState, title: e.target.value }
                                })
                              }
                              onKeyDown={(e) => e.key === 'Enter' && handleAddSubUnit(sub.id)}
                              placeholder="소단원명 입력"
                              className={`flex-1 px-3 py-2 rounded-xl text-xs border focus:outline-none focus:ring-1 focus:ring-indigo-500 ${
                                darkMode 
                                  ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' 
                                  : 'bg-slate-50 border-slate-200 text-slate-900'
                              }`}
                            />
                            <button
                              onClick={() => handleAddSubUnit(sub.id)}
                              className="px-3 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shrink-0 transition"
                            >
                              + 소단원
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* 탭 3: 아이폰 잠금화면 위젯 연동 */}
              {activeTab === 'widget' && (
                <div className="space-y-4">
                  <div className={`p-5 rounded-3xl border space-y-3 ${
                    darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'
                  }`}>
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <Smartphone className="w-5 h-5 text-indigo-400" />
                        <h3 className="font-bold text-base">잠금화면 위젯용 소단원 요약</h3>
                      </div>
                      <span className="text-[11px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 font-semibold">
                        실시간 반영
                      </span>
                    </div>

                    <div className={`p-3.5 rounded-2xl border font-mono text-xs whitespace-pre-line leading-relaxed ${
                      darkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'
                    }`}>
                      {widgetSummaryText}
                    </div>

                    <div className="grid grid-cols-1 gap-2 pt-1">
                      <button
                        onClick={() => copyToClipboard(widgetSummaryText, 'box')}
                        className="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 transition"
                      >
                        {copiedType === 'box' ? (
                          <><Check className="w-4 h-4" /> 클립보드에 복사 완료!</>
                        ) : (
                          <><Copy className="w-4 h-4" /> 사각 위젯용 소단원 요약 복사하기</>
                        )}
                      </button>

                      <button
                        onClick={() => copyToClipboard(inlineWidgetText, 'inline')}
                        className={`w-full py-2.5 rounded-2xl border font-semibold text-xs flex items-center justify-center gap-2 transition ${
                          darkMode 
                            ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' 
                            : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                        }`}
                      >
                        {copiedType === 'inline' ? (
                          <><Check className="w-4 h-4 text-emerald-400" /> 상단 한 줄 문구 복사 완료!</>
                        ) : (
                          <><Copy className="w-3.5 h-3.5" /> 시계 위 한 줄 위젯 복사</>
                        )}
                      </button>
                    </div>
                  </div>

                  <div className={`p-5 rounded-3xl border space-y-3 ${
                    darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'
                  }`}>
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-sm flex items-center gap-2">
                        <Code2 className="w-4 h-4 text-emerald-400" />
                        Scriptable 앱 위젯 코드 복사
                      </h3>
                      <span className="text-[10px] px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400 font-bold">
                        무료 위젯
                      </span>
                    </div>
                    <button
                      onClick={() => copyToClipboard(scriptableCodeSnippet, 'scriptable')}
                      className={`w-full py-2.5 rounded-2xl border font-bold text-xs flex items-center justify-center gap-2 transition ${
                        darkMode
                          ? 'bg-emerald-950/40 border-emerald-700/60 text-emerald-300 hover:bg-emerald-900/40'
                          : 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100'
                      }`}
                    >
                      {copiedType === 'scriptable' ? (
                        <><Check className="w-4 h-4" /> Scriptable 위젯 코드 복사 완료!</>
                      ) : (
                        <><Copy className="w-4 h-4" /> 내 시험범위 맞춤형 Scriptable 코드 복사</>
                      )}
                    </button>
                  </div>
                </div>
              )}

              {/* 탭 4: 설치 & 출시 안내 */}
              {activeTab === 'appstore' && (
                <div className="space-y-4">
                  <div className={`p-5 rounded-3xl border space-y-4 ${
                    darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'
                  }`}>
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                        <Rocket className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="font-extrabold text-base">아이폰 홈화면 설치 & 스토어 출시</h3>
                        <p className="text-xs opacity-60">GitHub Pages 주소를 아이폰 앱으로 등록하기</p>
                      </div>
                    </div>

                    <div className={`p-4 rounded-2xl border space-y-2 ${
                      darkMode ? 'bg-indigo-950/25 border-indigo-800/50' : 'bg-indigo-50/70 border-indigo-200'
                    }`}>
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-extrabold text-indigo-400 flex items-center gap-1.5">
                          <Globe className="w-4 h-4" /> 아이폰 사파리에서 10초 만에 앱으로 설치하기
                        </span>
                      </div>
                      <ol className={`text-xs space-y-1.5 list-decimal list-inside leading-relaxed ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>
                        <li>아이폰 <strong>Safari</strong>로 내 GitHub Pages 주소에 접속합니다.</li>
                        <li>하단 가운데 <strong>공유 버튼(⬆️)</strong> → <strong>[홈 화면에 추가]</strong>를 누릅니다.</li>
                        <li>아이폰 <strong>[단축어]</strong> 앱에서 'URL 열기' 액션을 만들고 잠금화면 위젯에 올리면 잠금화면에서 원터치로 실행됩니다!</li>
                      </ol>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* 하단 네비게이션 */}
            <nav className={`fixed bottom-0 left-0 right-0 z-30 border-t backdrop-blur-xl ${
              darkMode ? 'bg-slate-950/90 border-slate-800' : 'bg-white/90 border-slate-200'
            }`}>
              <div className="max-w-md mx-auto px-3 py-2 grid grid-cols-4 gap-1">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`flex flex-col items-center py-1 rounded-2xl transition ${
                    activeTab === 'home' ? 'text-indigo-500 font-bold' : darkMode ? 'text-slate-400' : 'text-slate-500'
                  }`}
                >
                  <Flame className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px]">출석·잔디</span>
                </button>

                <button
                  onClick={() => setActiveTab('scope')}
                  className={`flex flex-col items-center py-1 rounded-2xl transition ${
                    activeTab === 'scope' ? 'text-indigo-500 font-bold' : darkMode ? 'text-slate-400' : 'text-slate-500'
                  }`}
                >
                  <BookOpen className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px]">소단원 ({overallProgress.percent}%)</span>
                </button>

                <button
                  onClick={() => setActiveTab('widget')}
                  className={`flex flex-col items-center py-1 rounded-2xl transition ${
                    activeTab === 'widget' ? 'text-indigo-500 font-bold' : darkMode ? 'text-slate-400' : 'text-slate-500'
                  }`}
                >
                  <Smartphone className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px]">잠금화면 위젯</span>
                </button>

                <button
                  onClick={() => setActiveTab('appstore')}
                  className={`flex flex-col items-center py-1 rounded-2xl transition ${
                    activeTab === 'appstore' ? 'text-indigo-500 font-bold' : darkMode ? 'text-slate-400' : 'text-slate-500'
                  }`}
                >
                  <Rocket className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px]">설치 가이드</span>
                </button>
              </div>
            </nav>

            {/* 아이폰 잠금화면 미리보기 모달 */}
            {showLockPreview && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                <div className="relative w-full max-w-xs rounded-[44px] border-[6px] border-slate-700 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 p-6 text-white shadow-2xl flex flex-col items-center">
                  <div className="w-24 h-6 bg-black rounded-full mb-5 flex items-center justify-end px-2">
                    <div className="w-2.5 h-2.5 rounded-full bg-indigo-900/60" />
                  </div>

                  <div className="text-[11px] font-semibold text-indigo-200 tracking-wide flex items-center gap-1">
                    <span>{inlineWidgetText}</span>
                  </div>

                  <div className="text-6xl font-bold tracking-tight my-1 font-sans">
                    09:41
                  </div>

                  <div className="w-full grid grid-cols-3 gap-2.5 mt-3">
                    <div className="col-span-1 aspect-square rounded-2xl bg-white/15 backdrop-blur-md p-2.5 flex flex-col items-center justify-center border border-white/10">
                      <span className="text-[9px] text-indigo-200 font-medium truncate max-w-full">
                        {examInfo.title}
                      </span>
                      <span className="text-lg font-black text-white leading-tight mt-0.5">
                        {dDayInfo.label}
                      </span>
                      <span className="text-[10px] text-amber-300 font-bold mt-0.5">
                        🔥 {streakCount}일
                      </span>
                    </div>

                    <div className="col-span-2 rounded-2xl bg-white/15 backdrop-blur-md p-2.5 border border-white/10 flex flex-col justify-between">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold text-indigo-200">
                          📚 남은 소단원 ({overallProgress.percent}% 완료)
                        </span>
                      </div>
                      <div className="space-y-1 my-1">
                        {subjects.slice(0, 2).map(sub => {
                          const next = (sub.subUnits || []).find(u => !u.done);
                          return (
                            <div key={sub.id} className="text-[10px] truncate text-white/95">
                              • <strong>{sub.name}:</strong> {next ? `${next.code} ${next.title}` : '완주 🎉'}
                            </div>
                          );
                        })}
                      </div>
                      <div className="w-full h-1 bg-white/20 rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-400" style={{ width: `${overallProgress.percent}%` }} />
                      </div>
                    </div>
                  </div>

                  <div className="w-full mt-3 p-2.5 rounded-2xl bg-white/10 border border-white/10 text-left">
                    <div className="text-[9px] text-amber-300 font-bold">
                      [{currentQuote.category}] {currentQuote.sub}
                    </div>
                    <div className="text-[10px] text-white/90 line-clamp-2 mt-0.5">
                      "{currentQuote.text}"
                    </div>
                  </div>

                  <button
                    onClick={() => setShowLockPreview(false)}
                    className="mt-5 w-full py-2.5 rounded-2xl bg-white text-slate-900 font-bold text-xs shadow-lg"
                  >
                    잠금화면 미리보기 닫기
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
